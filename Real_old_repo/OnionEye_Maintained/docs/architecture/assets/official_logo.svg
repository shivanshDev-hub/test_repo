<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glowing White Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Outer Eye Shape (Sleek Cornea Outline) -->
  <path d="M 50 250 C 150 120, 350 120, 450 250 C 350 380, 150 380, 50 250 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        opacity="0.8"
        filter="url(#glow)" />

  <!-- Inner Eye Glow Mask -->
  <path d="M 50 250 C 150 120, 350 120, 450 250 C 350 380, 150 380, 50 250 Z" 
        fill="#0A1128" 
        opacity="0.9" />

  <!-- TOR ROUTER SYMBOL AS THE IRIS / PUPIL -->
  <g transform="translate(250, 250)" filter="url(#glow)">
    
    <!-- Outer Ring / Orbit -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4" />
    
    <!-- Middle Ring / Relay Node Links -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FFFFFF" stroke-width="4" />
    
    <!-- Connecting Circuit Lines to Nodes -->
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#FFFFFF" stroke-width="3" />
    <line x1="0" y1="0" x2="-39" y2="22" stroke="#FFFFFF" stroke-width="3" />
    <line x1="0" y1="0" x2="39" y2="22" stroke="#FFFFFF" stroke-width="3" />

    <!-- The 3 Tor Circuit Nodes (Circles) -->
    <circle cx="0" cy="-45" r="9" fill="#FFFFFF" />
    <circle cx="-39" cy="22" r="9" fill="#FFFFFF" />
    <circle cx="39" cy="22" r="9" fill="#FFFFFF" />

    <!-- Central Pupil Core -->
    <circle cx="0" cy="0" r="14" fill="#020617" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
  </g>

  <!-- Ambient Light Reflection on Cornea -->
  <ellipse cx="220" cy="210" rx="15" ry="8" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 220 210)" />
</svg>
