# OnionEye — anti-fingerprint / hardening reverse proxy
# Only port 80 is exposed to the host (everything else binds 127.0.0.1).
# server_tokens off hides the exact nginx version; security headers + Basic
# Auth are applied globally (htpasswd file is generated at container start
# from NGINX_AUTH_USER/NGINX_AUTH_PASS — see entrypoint-htpasswd.sh).

server_tokens off;
etag off;

upstream ingestion_api {
    server ingestion-api:8080;
}

upstream dashboard_api {
    server dashboard-api:3000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # ── Global OPSEC headers + analyst authentication ─────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cache-Control "no-store" always;

    # Analyst-facing protection: every route requires Basic Auth. Credentials
    # are provisioned at startup from .env (never committed).
    auth_basic "OnionEye Analyst Portal";
    auth_basic_user_file /etc/nginx/htpasswd;

    # ── Ingestion API ──────────────────────────────────────────────────────────
    location /api/v1/investigations {
        proxy_pass http://ingestion_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
    }

    # Legacy alias kept so older clients still reach ingestion.
    location /api/v1/ingest {
        proxy_pass http://ingestion_api/api/v1/investigations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
    }

    # ── Dashboard API ──────────────────────────────────────────────────────────
    location /api/v1/dashboard {
        proxy_pass http://dashboard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
    }

    # ── Dashboard SPA ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
    }

    # ── Health check (no auth — used by orchestrator/liveness probes) ─────────
    location /health {
        auth_basic off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }
}
