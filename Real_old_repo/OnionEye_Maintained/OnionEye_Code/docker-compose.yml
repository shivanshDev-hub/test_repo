# ─── Logging anchor (applied to every service) ──────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["sh", "-c", "exec redis-server --requirepass $$REDIS_PASSWORD --save '' --appendonly no --dir /tmp/redis"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    tmpfs:
      - /tmp/redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      - backend

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onioneye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-onioneye}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-onioneye}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, SETUID, SETGID, FOWNER, CHOWN]
    security_opt: [no-new-privileges:true]
    networks:
      - backend

  # ── Team 2 — Tor Sidecar ──────────────────────────────────────────────────────

  tor-sidecar:
    build:
      context: ./tor-sidecar
    image: onioneye-tor-sidecar:local
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    devices:
      - /dev/net/tun
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - tor_data:/var/lib/tor
    environment:
      TOR_CONTROL_PASSWORD: ${TOR_CONTROL_PASSWORD}
    init: true
    pids_limit: 256
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - crawler

  # ── Team 2 — Crawler Worker Pool ─────────────────────────────────────────────

  crawler-worker:
    build:
      context: ./services/crawler-worker
    image: onioneye-crawler-worker:local
    depends_on:
      redis:
        condition: service_healthy
      tor-sidecar:
        condition: service_started
      storage-api:
        condition: service_started
      render-sandbox:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TOR_SOCKS_ADDR: tor-sidecar:9050
      TOR_CONTROL_ADDR: tor-sidecar:9051
      TOR_CONTROL_PASSWORD: ${TOR_CONTROL_PASSWORD}
      STORAGE_API_URL: http://storage-api:8081
      DASHBOARD_API_URL: ${DASHBOARD_API_URL:-http://dashboard-api:3000}
      DASHBOARD_NOTIFY_PATH: ${DASHBOARD_NOTIFY_PATH:-/api/v1/dashboard/notify}
      DASHBOARD_NOTIFY_TIMEOUT: ${DASHBOARD_NOTIFY_TIMEOUT:-3s}
      RENDER_SANDBOX_URL: http://render-sandbox:8084
      RENDER_SANDBOX_TOKEN: ${RENDER_SANDBOX_TOKEN}
      MAX_CONCURRENT_SCREENSHOTS: ${MAX_CONCURRENT_SCREENSHOTS:-4}
      CRAWLER_WORKER_TOKEN: ${CRAWLER_WORKER_TOKEN}
      HTTP_ADDR: ":8084"
      ANOMALY_FAST_IDLE_TURNS: ${ANOMALY_FAST_IDLE_TURNS:-3}
      ANOMALY_FAST_TURN_DUR: ${ANOMALY_FAST_TURN_DUR:-1s}
      ANOMALY_MAX_FAIL_TURNS: ${ANOMALY_MAX_FAIL_TURNS:-3}
      ANOMALY_BACKOFF: ${ANOMALY_BACKOFF:-15s}
      ANOMALY_MAX_PER_MINUTE: ${ANOMALY_MAX_PER_MINUTE:-5}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    init: true
    pids_limit: 256
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - crawler
      - backend

  # ── Content Safety Shield ────────────────────────────────────────────────────

  content-shield:
    build:
      context: ./services/content-shield
    image: onioneye-content-shield:local
    depends_on:
      storage-api:
        condition: service_started
    environment:
      STORAGE_API_URL: http://storage-api:8081
      CSAM_HASH_SET_PATH: ${CSAM_HASH_SET_PATH:-/data/hashes/csam_hashes.sha256}
    volumes:
      - ./db/seed/hashes:/data/hashes:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - backend

  # ── Content Filter (Phase 8A ML Abusive-Content Classifier) ──────────────────

  content-filter:
    build:
      context: ./services/content-filter
    image: onioneye-content-filter:local
    environment:
      PORT: "8082"
      USE_MOCK_MODELS: ${USE_MOCK_MODELS:-true}
      MODEL_PATH_AGE: /models/age_mlp.onnx
      MODEL_PATH_NUDITY: /models/nudity_mobilenet.onnx
      MODEL_PATH_BEHAVIOR: /models/pose_mlp.onnx
      NUDITY_MODEL_SIZE: ${NUDITY_MODEL_SIZE:-224}
      ONNX_RUNTIME_LIB: /usr/lib/libonnxruntime.so
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    read_only: true
    logging: *default-logging
    networks:
      - backend

  # ── Storage API ──────────────────────────────────────────────────────────────

  storage-api:
    build:
      context: ./services/storage-api
    image: onioneye-storage-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STORAGE_API_PORT: "8081"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-onioneye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-onioneye}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - backend

  # ── Render Sandbox (air-gapped Chromium screenshot renderer) ────────────────
  # Zero-trust: seccomp profile + no-new-privileges, no network, JS disabled.
  # Only reaches the backend network; crawler-worker talks to it for on-demand
  # screenshots. Fails closed when RENDER_SANDBOX_TOKEN is unset.

  render-sandbox:
    build:
      context: ./services/render-sandbox
    image: onioneye-render-sandbox:local
    depends_on:
      storage-api:
        condition: service_started
    environment:
      RENDER_SANDBOX_PORT: "8084"
      RENDER_SANDBOX_TOKEN: ${RENDER_SANDBOX_TOKEN}
      CHROME_BINARY: /usr/bin/chromium
      RENDER_MAX_CONCURRENT: ${RENDER_MAX_CONCURRENT:-2}
    read_only: true
    tmpfs:
      - /tmp
      - /home/sandbox/.config
    cap_drop: [ALL]
    init: true
    pids_limit: 128
    mem_limit: 768m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
      - seccomp:./config/seccomp/render-sandbox.json
    logging: *default-logging
    networks:
      - backend

  # ── Ollama (AI profile, optional) ─────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - backend

  # ── Ingestion API ────────────────────────────────────────────────────────────

  ingestion-api:
    build:
      context: ./services/ingestion-api
    image: onioneye-ingestion-api:local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      INGESTION_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-onioneye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-onioneye}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-5}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      SESSION_WINDOW_SECONDS: ${SESSION_WINDOW_SECONDS:-900}
      ALLOWLIST_PATH: /config/target_allowlist.yaml
      OLLAMA_URL: http://ollama:11434
      EXPANDER_MODEL: ${EXPANDER_MODEL:-qwen2.5:3b}
      GUARD_MODEL: ${GUARD_MODEL:-llama-guard3:1b}
      MAX_SEED_TERMS: ${MAX_SEED_TERMS:-10}
      MAX_DEPTH_DEFAULT: ${MAX_DEPTH_DEFAULT:-3}
      MAX_DEPTH_MAX: ${MAX_DEPTH_MAX:-5}
    volumes:
      - ./config/target_allowlist.yaml:/config/target_allowlist.yaml:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - backend

  # ── Correlation Engine ──────────────────────────────────────────────────────

  correlation-engine:
    build:
      context: ./services/correlation-engine
    image: onioneye-correlation-engine:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-api:
        condition: service_started
    environment:
      CORRELATION_PORT: "8083"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-onioneye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-onioneye}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - backend

  # ── Dashboard API ───────────────────────────────────────────────────────────

  dashboard-api:
    build:
      context: ./services/dashboard-api
    image: onioneye-dashboard-api:local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-sock-proxy:
        condition: service_started
    environment:
      DASHBOARD_PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-onioneye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-onioneye}
      DOCKER_PROJECT: ${COMPOSE_PROJECT_NAME:-onioneye_code}
      DOCKER_API_URL: http://docker-sock-proxy:2375
      DASHBOARD_ALLOWED_ORIGIN: ${DASHBOARD_ALLOWED_ORIGIN:-http://localhost}
      CRAWLER_WORKER_URL: ${CRAWLER_WORKER_URL:-http://crawler-worker:8084}
      CRAWLER_WORKER_TOKEN: ${CRAWLER_WORKER_TOKEN}
      STORAGE_API_URL: http://storage-api:8081
      RENDER_SANDBOX_URL: http://render-sandbox:8084
      RENDER_SANDBOX_TOKEN: ${RENDER_SANDBOX_TOKEN}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - frontend
      - backend
      - docker-proxy

  # ── Docker Socket Proxy (restricted read-only Docker API gateway) ──────────
  # Replaces the raw /var/run/docker.sock mount. Tecnativa proxy allows only
  # GET /containers/json, /containers/*/logs, /containers/*/stats, /info,
  # /version — all POST/DELETE/EXEC paths are denied by default.

  docker-sock-proxy:
    image: tecnativa/docker-socket-proxy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - docker-proxy

  # ── Frontend (SPA) ──────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
    image: onioneye-frontend:local
    depends_on:
      - dashboard-api
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - frontend

  # ── Reverse Proxy ─────────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    ports:
      - "80:80"
    environment:
      NGINX_AUTH_USER: ${NGINX_AUTH_USER}
      NGINX_AUTH_PASS: ${NGINX_AUTH_PASS}
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/entrypoint-htpasswd.sh:/docker-entrypoint.d/90-onioneye-htpasswd.sh:ro
    depends_on:
      - ingestion-api
      - dashboard-api
      - frontend
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, DAC_OVERRIDE, FOWNER, CHOWN]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - frontend
      - backend

# ── Volumes ─────────────────────────────────────────────────────────────────────

volumes:
  redis_data:
  postgres_data:
  ollama_data:
  tor_data:

# ── Networks ────────────────────────────────────────────────────────────────────
# Segmented: each service can only reach the networks it needs.
#   frontend  : nginx ↔ frontend SPA ↔ dashboard-api (UI layer)
#   backend   : all APIs, redis, postgres, ollama, crawler-worker (data layer)
#   crawler   : crawler-worker ↔ tor-sidecar (egress isolation)
#   docker-proxy : dashboard-api ↔ docker-sock-proxy (audit log, exec denied)

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  crawler:
    driver: bridge
    # NOT internal: tor-sidecar needs egress to bootstrap Tor circuits.
    # Traffic leak is prevented by iptables kill switch inside the container.
  docker-proxy:
    driver: bridge
    internal: true   # isolated: no external traffic possible